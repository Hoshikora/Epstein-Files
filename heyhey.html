<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine Sequence</title>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background-color: #ffe6f0;
    font-family: Arial, sans-serif;
    overflow: hidden;
  }

  .card {
    background-color: white;
    border-radius: 20px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    padding: 30px;
    text-align: center;
    width: 350px;
    transition: opacity 0.5s ease;
    opacity: 1;
    position: relative;
  }

  .card.fade-out {
    opacity: 0;
  }

  .card img {
    width: 100%;
    border-radius: 15px;
    margin-bottom: 20px;
  }

  h1 {
    color: #ff3366;
    margin-bottom: 20px;
  }

  .buttons {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 10px;
  }

  button {
    padding: 12px 25px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  #yes {
    background-color: #ff3366;
    color: white;
  }

  #no {
    background-color: #cccccc;
    color: #333;
  }

  #press, #next {
    background-color: #ff3366;
    color: white;
  }

  .two-images {
    display: flex;
    justify-content: space-between;
    gap: 10px;
  }

  .two-images img {
    width: 48%;
    border-radius: 15px;
  }

  .heart {
    position: absolute;
    font-size: 20px;
    color: #ff3366;
    animation: floatUp 3s linear forwards;
  }

  @keyframes floatUp {
    0% { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(-200px) scale(1.5); opacity: 0; }
  }
</style>
</head>
<body>

<div class="card" id="card">

  <h1>Hi baby cherii, I'm so sorry for the past few days 😥</h1>
  <img src="images/cute-kitten.gif" alt="Intro Image">
  <div class="buttons">
    <button id="press">Press me</button>
  </div>
</div>

<script>
const card = document.getElementById('card');

document.getElementById('press').addEventListener('click', () => {
  transitionTo(showValentineCard);
});

function transitionTo(nextCard) {
  card.classList.add('fade-out');
  setTimeout(() => {
    nextCard();
    card.classList.remove('fade-out');
  }, 500);
}

function showValentineCard() {
  card.innerHTML = `
    <h1>Hehe love, Will you be my Valentine?</h1>
    <img src="images/source.gif" alt="Valentine Image">
    <div class="buttons">
      <button id="yes">Yes ❤️</button>
      <button id="no">No 💔</button>
    </div>
  `;

  const yesButton = document.getElementById('yes');
  const noButton = document.getElementById('no');
  let yesSize = 1;
  let noSize = 1;

  const noMessages = [
    "Are you sure?", 
    "Really sure??", 
    "Really Really sure??", 
    "Change your mind please!", 
    "Okay, last chance!", 
    "What!! You really don't want?", 
    "Are you really sure?", 
    "No way?", 
    "Still no?", 
    "Think again!", 
    "Don't be shy!", 
    "Nope?", 
    "Not convinced yet?", 
    "Are you serious?", 
    "Last warning!"
  ];
  let clickCount = 0;

  noButton.addEventListener('click', () => {
    clickCount++;
    noButton.textContent = clickCount < noMessages.length ? noMessages[clickCount] : "No way 😅";
    yesSize += 0.2;
    yesButton.style.transform = `scale(${yesSize})`;
    noSize -= 0.1;
    noSize = Math.max(noSize, 0.2);
    noButton.style.transform = `scale(${noSize})`;
  });

  yesButton.addEventListener('click', () => {
    transitionTo(showSecondCard);
  });
}

function showSecondCard() {
  card.innerHTML = `
    <h1>WAHAHAHA!!!!! You said yes poo ❤️</h1>
    <img src="images/happycat.gif" alt="Love Image">
    <div class="buttons">
      <button id="next">Next ➡️</button>
    </div>
  `;

  createFloatingHearts(10);

  document.getElementById('next').addEventListener('click', () => {
    transitionTo(showThirdCard);
  });
}


function createFloatingHearts(count) {
  for (let i = 0; i < count; i++) {
    const heart = document.createElement('div');
    heart.classList.add('heart');
    heart.textContent = '❤️';
    heart.style.left = Math.random() * (card.offsetWidth - 20) + 'px';
    heart.style.top = card.offsetHeight + 'px';
    heart.style.animationDuration = (2 + Math.random() * 2) + 's';
    card.appendChild(heart);
    setTimeout(() => heart.remove(), 4000);
  }
}

function showThirdCard() {
  card.innerHTML = `
    <h1>Look at us together, loveyy ❤️</h1>
    <div class="two-images">
      <img src="images/hehehe.jpeg" alt="Image 1">
      <img src="images/hehelov.jpeg" alt="Image 2">
    </div>
  `;
}
</script>

</body>
</html>
