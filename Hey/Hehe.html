<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine Sequence</title>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background-color: #ffe6f0;
    font-family: Arial, sans-serif;
  }

  .card {
    background-color: white;
    border-radius: 20px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    padding: 30px;
    text-align: center;
    width: 350px;
    position: relative;
    transition: all 0.5s ease;
  }

  .card img {
    width: 100%;
    border-radius: 15px;
    margin-bottom: 20px;
  }

  h1 {
    color: #ff3366;
    margin-bottom: 20px;
  }

  .buttons {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 10px;
  }

  button {
    padding: 12px 25px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
  }

  #yes {
    background-color: #ff3366;
    color: white;
    z-index: 1;
  }

  #no {
    background-color: #cccccc;
    color: #333;
    z-index: 1;
  }

  #next, #press {
    background-color: #ff3366;
    color: white;
  }

  .two-images {
    display: flex;
    justify-content: space-between;
    gap: 10px;
  }

  .two-images img {
    width: 48%;
    border-radius: 15px;
  }
</style>
</head>
<body>

<div class="card" id="card">

  <h1>Hi baby cherii, I'm so sorry for the past few days 😥</h1>
  <img src="c:\Users\jkris\Downloads\Hey\cute-kitten.gif" alt="Intro Image">
  <div class="buttons">
    <button id="press">Press me</button>
  </div>
</div>

<script>
  const card = document.getElementById('card');

  document.getElementById('press').addEventListener('click', () => {

    card.innerHTML = `
      <h1>Hehe love, Will you be my Valentine?</h1>
      <img src="source.gif" alt="cute Image">
      <div class="buttons">
        <button id="yes">Yes ❤️</button>
        <button id="no">No 💔</button>
      </div>
    `;

    const yesButton = document.getElementById('yes');
    const noButton = document.getElementById('no');
    let yesSize = 1;
    let noSize = 1;
    const noMessages = [
      "Are you sure?", 
      "Really sure??", 
      "Really Really sure??", 
      "Change your mind please!", 
      "Okay, last chance!", 
      "What!! You really don't want?", 
      "Are you really sure?", 
      "No way?", 
      "Still no?", 
      "Think again!", 
      "Don't be shy!", 
      "Nope?", 
      "Not convinced yet?", 
      "Are you serious?", 
      "Last warning!"
    ];
    let clickCount = 0;

    noButton.addEventListener('click', () => {
      clickCount++;
      if (clickCount < noMessages.length) {
        noButton.textContent = noMessages[clickCount];
      } else {
        noButton.textContent = "No way 😅";
      }

      yesSize += 0.2;
      yesButton.style.transform = `scale(${yesSize})`;

      noSize -= 0.1;
      if (noSize < 0.2) noSize = 0.2;
      noButton.style.transform = `scale(${noSize})`;
    });

    yesButton.addEventListener('click', () => {
      card.innerHTML = `
        <h1>WAHAHAHA!!!!! You said yes poo ❤️</h1>
        <img src="happycat.gif" alt="Love Image">
        <div class="buttons">
          <button id="next">Next ➡️</button>
        </div>
      `;

      document.getElementById('next').addEventListener('click', () => {
        card.innerHTML = `
          <h1>Look at us together, loveyy ❤️</h1>
          <div class="two-images">
            <img src="hehelov.jpeg" alt="us Image 1">
            <img src="hehehe.jpeg" alt="us Image 2">
          </div>
        `;
      });
    });
  });
</script>

</body>
</html>
